name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up NuGet CLI
        uses: NuGet/setup-nuget@v2

      - name: Restore
        run: dotnet restore DataverseAuditManager.XrmToolBox.csproj --configfile NuGet.Config

      - name: Build
        run: dotnet build DataverseAuditManager.XrmToolBox.csproj --configuration Release --no-restore

      - name: Pack and validate
        shell: pwsh
        run: ./Pack.ps1 -NoBuild

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataverse-audit-manager-package
          path: artifacts/*.nupkg
          if-no-files-found: error

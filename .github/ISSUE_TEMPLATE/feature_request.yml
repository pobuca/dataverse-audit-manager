name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the administration problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Note any Dataverse writes, audit deletion, permissions, or performance implications.
  - type: checkboxes
    id: sensitive
    attributes:
      label: Data safety
      options:
        - label: This request contains no credentials or customer/environment data.
          required: true
